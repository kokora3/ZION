name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify frozen shared genesis
        run: go run ./cmd/zionctl genesis verify --manifest configs/alpha-1/validators-public.json --genesis configs/alpha-1/genesis.json --genesis-id configs/alpha-1/genesis-id.txt --json
      - name: Reject tracked validator private material
        shell: bash
        run: |
          test -z "$(git ls-files | grep -E '(^|/)(priv_validator_key\.json|priv_validator_state\.json)$' || true)"
          if git grep -n -E '"priv_key"[[:space:]]*:' -- configs docs; then exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build binaries
        run: |
          go build ./cmd/zion-node
          go build ./cmd/zionctl
      - name: Test with race detector
        run: go test -race -p=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose --profile normal --profile bootstrap --profile validator --profile web config --quiet
      - name: Build production images
        env:
          ZION_REVISION: ${{ github.sha }}
          ZION_BUILD_DATE: "1970-01-01T00:00:00Z"
        run: docker compose --profile normal --profile web build zion-node-normal zion-web
      - name: Start NORMAL and Web
        run: docker compose --profile normal --profile web up -d
      - name: Wait for NORMAL health
        shell: bash
        run: |
          for attempt in $(seq 1 24); do
            state=$(docker inspect --format '{{.State.Health.Status}}' zion-node-normal 2>/dev/null || true)
            [ "$state" = healthy ] && exit 0
            [ "$state" = unhealthy ] && docker compose logs && exit 1
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Container status and Web smoke
        run: |
          docker compose exec -T zion-node-normal zionctl --bearer-token-file /var/lib/zion/runtime/api-token status
          curl --fail --retry 12 --retry-delay 2 http://127.0.0.1:3000/
      - name: Clean shutdown
        if: always()
        run: docker compose down --volumes --remove-orphans
