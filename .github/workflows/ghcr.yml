name: Prepare GHCR Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version without leading v
        required: true
        default: 0.1.0-alpha.1
      publish:
        description: Push versioned images to GHCR
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: zion-node
            dockerfile: deploy/docker/zion-node.Dockerfile
          - name: zion-web
            dockerfile: deploy/docker/zion-web.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Derive immutable short revision tag
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        if: ${{ inputs.publish }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          build-args: |
            VERSION=v${{ inputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
          tags: |
            ghcr.io/kokora3/${{ matrix.name }}:v${{ inputs.version }}
            ghcr.io/kokora3/${{ matrix.name }}:${{ inputs.version }}
            ghcr.io/kokora3/${{ matrix.name }}:sha-${{ env.SHORT_SHA }}
