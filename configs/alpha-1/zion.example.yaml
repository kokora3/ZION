# Phase 11 local runtime example. It contains no private keys and is not canonical state.
network_id: zion-alpha-1
genesis_id: <verified-64-character-lowercase-genesis-sha256>
data_directory: <set-a-local-data-directory>
roles: [NORMAL]
p2p:
  enabled: true
  # Separate from the CometBFT validator P2P port.
  listen_addresses:
    - /ip4/0.0.0.0/udp/42000/quic-v1
  # DNS/IP is location; /p2p/<PeerID> is the expected cryptographic identity.
  bootstrap_addresses:
    - /dns4/bootstrap-zion.kokora.info/udp/42000/quic-v1/p2p/<verified-bootstrap-peer-id>
  fallback_addresses: []
  manual_peers: []
  peer_key_path: <data-directory>/p2p/peer.key
  peer_cache_path: <data-directory>/p2p/peers.json
  max_connected_peers: 64
  target_outbound_peers: 12
  max_concurrent_dials: 8
  max_cached_peers: 256
  max_addresses_per_peer: 8
  max_pex_peers_per_response: 32
api:
  listen: 127.0.0.1:42001
  allowed_origins: []
  bearer_token_file: "" # Required by the implementation for non-loopback binding.
objects:
  # Local off-chain storage. Neither this path nor quota enters StateHash/AppHash.
  directory: <data-directory>/objects
  quota_bytes: 1073741824 # 1 GiB; each canonical object is hard-limited to 1 MiB.
board:
  # Board events/content use the object store; this derived index is rebuildable.
  enabled: true
  index_path: <data-directory>/board/index.json
  announce_fanout: 8
  sync_interval: 30s
  sync_page_size: 16
  max_sync_events_per_cycle: 256
  max_concurrent_handlers: 8
  peer_timeout: 3s
registries:
  # Rebuildable local search index; canonical entries remain in chain state.
  index_path: <data-directory>/registries/index.json
consensus:
  # Set enabled: true together with a VALIDATOR role. The root must already
  # contain the matching CometBFT genesis, private-validator, and node-key files.
  enabled: false
  root_directory: <data-directory>/consensus
  moniker: ""
  p2p_listen_address: tcp://0.0.0.0:26656
  persistent_peers: ""
  rpc_listen_address: "" # The supported local API is the versioned API above.
  create_empty_blocks: false
