# D2A shared-alpha NORMAL + BOOTSTRAP config. BOOTSTRAP grants no authority.
# The public advertised address is supplied by the generic Compose override.
network_id: zion-alpha-1
genesis_id: 72ef0c7816d64255fc7b1da266c6a5b5ca345dd89cba2423fc8cfc8b4d1a61c6
data_directory: /var/lib/zion
log_level: INFO
roles: [NORMAL, BOOTSTRAP]
p2p:
  enabled: true
  listen_addresses: [/ip4/0.0.0.0/udp/42000/quic-v1]
  advertise_addresses: []
  bootstrap_addresses: []
  fallback_addresses: []
  manual_peers: []
  peer_key_path: /var/lib/zion/p2p/peer.key
  peer_cache_path: /var/lib/zion/p2p/peers.json
  max_connected_peers: 64
  target_outbound_peers: 12
  max_concurrent_dials: 8
  max_cached_peers: 256
  max_addresses_per_peer: 8
  max_pex_peers_per_response: 32
api:
  # Container-local protected listener; Compose publishes no API or metrics port.
  listen: 0.0.0.0:42001
  metrics_enabled: true
  allowed_origins: []
  bearer_token_file: /var/lib/zion/runtime/api-token
objects:
  directory: /var/lib/zion/objects
  quota_bytes: 1073741824
board:
  enabled: true
  index_path: /var/lib/zion/board/index.json
  announce_fanout: 8
  sync_interval: 30s
  sync_page_size: 16
  max_sync_events_per_cycle: 256
  max_concurrent_handlers: 8
  peer_timeout: 3s
registries:
  index_path: /var/lib/zion/registries/index.json
consensus:
  enabled: false
  root_directory: ""
  moniker: ""
  p2p_listen_address: ""
  persistent_peers: ""
  rpc_listen_address: ""
  create_empty_blocks: false
